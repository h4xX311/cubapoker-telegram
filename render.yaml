# Render Blueprint - CubaPoker Telegram Bot
#
# ------------------------------------------------------------------
# POR QUE `plan: starter` Y NO `free`
#
# El plan gratuito de Render suspende el servicio a los 15 minutos de inactividad.
# Para un bot de poker eso no es un inconveniente menor, es el producto roto:
#
#  - Un campo de 300 jugadores tarda horas en terminar. Si el proceso se suspende a
#    mitad, las mesas quedan con fichas de jugadores bloqueadas y el campo no se
#    puede ni continuar ni cerrar. El reinicio las deja en `paused` y el operador
#    tiene que decidir que hacer con el dinero de cada uno.
#  - El webhook de pagos deja de responder. Un deposito que el usuario ya hizo se
#    queda sin confirmar, y el operador no sabe si acreditarlo.
#  - Los bots que no hacen llamadas HTTP (un timer de reparto, un campo esperando
#    jugadores) son justo el caso que Render suspende. El juego es precisamente
#    ese caso.
#
# El plan `starter` cuesta 7 USDT/mes y no suspende. Es el minimo para que el
# producto funcione, y es mas barato que el primer servicio mal atendido.
#
# ALTERNATIVA BARATA: si 7 USDT/mes es un problema al principio, la opcion es no
# desplegar hasta que haya usuarios. Un CubaPoker suspendido no pierde clientes
# con abogado; uno que se cae a mitad de un campo si.
services:
  - type: web
    name: cubapoker-telegram-bot
    runtime: node
    plan: starter
    # ------------------------------------------------------------------
# POR QUE `--include=dev` EN EL `npm install`, Y NO ES COSA ESTILISTICA
#
# El servicio corre con `NODE_ENV=production` (ver `envVars`), que es lo correcto: bloquea
# el bypass de desarrollo y desactiva el polling. Y tiene un efecto secundario que rompia
# el build entero:
#
#     Failed to load PostCSS config: Cannot find module 'tailwindcss'
#
# Con `NODE_ENV=production`, `npm install` se SALTA los `devDependencies`. Tailwind, PostCSS
# y Autoprefixer viven ahi (son la herramienta con la que se compila la web, no codigo que
# se ejecute), asi que no se instalaban y `vite build` moria.
#
# El fallo es engañoso: dice que falta un modulo, no que el flag de produccion lo salto. Y
# deja el servicio sin interfaz: la API funciona, el bot habla con Telegram, y el Mini App no
# existe. Justo los symptoms que parecen de configuracion de Telegram.
#
# `--include=dev` instala tambien los `devDependencies` durante el BUILD. No cambia nada de
# lo que se ejecuta en produccion: `node dist/bot.js` no importa ni tailwind ni postcss, y
# no se instalan en el contenedor final mas de lo que se instalan ahora.
# ------------------------------------------------------------------
buildCommand: npm install --include=dev && npm run build && cd mini-app && npm install --include=dev && npm run build
    startCommand: node dist/bot.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: USDT_CONTRACT_ADDRESS
        value: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgLj6t
      - key: ENZONA_CLIENT_ID
        sync: false
      - key: ENZONA_CLIENT_SECRET
        sync: false
      - key: QVAPAY_APP_ID
        sync: false
      - key: QVAPAY_APP_SECRET
        sync: false
      - key: EPUSDT_API_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      # --- Pagos ---
      # true = pantalla de prueba integrada, no mueve dinero real.
      # Poner en false SOLO cuando SIMULATE_PAYMENTS y las pasarelas reales
      # esten conectadas (ver LAUNCH_CHECKLIST.md).
      - key: SIMULATE_PAYMENTS
        value: "true"
      - key: SIMULATION_SECRET
        generateValue: true
      # Si no se define, las rutas administrativas quedan deshabilitadas.
      - key: ADMIN_API_KEY
        generateValue: true
      # Nunca activar en produccion: permite suplantar cualquier cuenta.
      - key: DEV_AUTH_BYPASS
        value: "false"
